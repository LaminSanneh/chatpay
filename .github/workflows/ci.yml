name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Scripts, mock servers and their unit tests. Starts no service.
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check

  # Unit tests + integration tests (*IT) against real Postgres and RabbitMQ started by Testcontainers (Docker is on the runner).
  wallet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/wallet-service
    env:
      DOCKER_API_VERSION: '1.44'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-test-reports
          path: |
            services/wallet-service/target/surefire-reports
            services/wallet-service/target/failsafe-reports
          if-no-files-found: ignore

  chat-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://chat:chat@localhost:5432/chat
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
    defaults:
      run:
        working-directory: services/chat-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/chat-service/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  web-apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [apps/web, apps/store-web]
    env:
      NEXT_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build

  # The store tests run on in-memory SQLite with a fake wallet and fake Keycloak logins: no database service needed.
  store-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/store-backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, curl, zip, xml, openssl, bcmath, pdo_sqlite, pdo_pgsql
          tools: composer:v2
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('services/store-backend/composer.lock') }}
          restore-keys: composer-
      - run: cp -n .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate
      - run: php artisan test

  # One required check for branch protection.
  ci-ok:
    if: always()
    needs: [repo-checks, wallet, chat-service, web-apps, store-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Everything passed?
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
