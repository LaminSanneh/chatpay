; Keeps the store backend's long-running processes alive (Supervisor). Adjust the paths and user.
; The web side (API + back office) is served by php-fpm / nginx, or `php artisan serve` in development.
; After editing:  supervisorctl reread && supervisorctl update

[program:store-events]
command=php /var/www/store-backend/artisan events:consume
directory=/var/www/store-backend
user=www-data
autostart=true
autorestart=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/store-events.log

[program:store-outbox]
command=php /var/www/store-backend/artisan outbox:relay
directory=/var/www/store-backend
user=www-data
autostart=true
autorestart=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/store-outbox.log

[program:store-schedule]
command=php /var/www/store-backend/artisan schedule:work
directory=/var/www/store-backend
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/store-schedule.log
